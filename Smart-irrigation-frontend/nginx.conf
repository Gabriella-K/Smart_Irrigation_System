# nginx.conf — Nginx server block for the React SPA
# All routes are redirected to index.html so React Router can handle them.

server {
    listen 80;
    server_name localhost;

    # Serve the React build output
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any path that doesn't match a real file serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend container
    # The frontend makes requests to /api/... which Nginx forwards to the backend
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
